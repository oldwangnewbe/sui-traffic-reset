<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>s-ui 用户流量面板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #171a1f;
      --muted: #667181;
      --line: #dfe4ea;
      --soft: #f0f4f8;
      --primary: #1267d3;
      --primary-dark: #0b54ad;
      --danger: #c83232;
      --ok: #177245;
      --warn: #9a6400;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(10px);
    }
    h1, h2 { margin: 0; }
    h1 { font-size: 18px; }
    h2 { font-size: 16px; }
    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 18px;
    }
    section, .login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(20, 35, 60, .045);
    }
    .brand { display: grid; gap: 2px; }
    .brand-subtitle, .muted { color: var(--muted); }
    .toolbar, .form-grid, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
    }
    .header-tools { align-items: center; }
    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    input, select, button {
      height: 36px;
      border-radius: 6px;
      border: 1px solid var(--line);
      padding: 0 11px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    input, select { min-width: 150px; }
    input[type="checkbox"] { height: auto; width: auto; min-width: 0; }
    button {
      border-color: transparent;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-weight: 650;
      box-shadow: 0 1px 1px rgba(10, 65, 130, .08);
    }
    button:hover { background: var(--primary-dark); }
    button.secondary {
      background: #eef3f8;
      color: var(--primary-dark);
      border-color: #cbd8e5;
      box-shadow: none;
    }
    button.ghost {
      background: #fff;
      color: #405064;
      border-color: var(--line);
      box-shadow: none;
    }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .login-shell {
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(420px, 100%);
      display: grid;
      gap: 16px;
    }
    .login-card input { width: 100%; }
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    .section-title { display: grid; gap: 6px; min-width: 220px; }
    .status { color: var(--muted); min-height: 22px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
      margin: 8px 0 14px;
    }
    .metric {
      border: 1px solid var(--soft);
      background: #fbfcfe;
      border-radius: 8px;
      padding: 12px 14px;
      display: grid;
      gap: 4px;
    }
    .metric span { color: var(--muted); font-size: 12px; }
    .metric strong { font-size: 18px; line-height: 1.1; }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 11px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    th {
      color: var(--muted);
      font-weight: 650;
      white-space: nowrap;
      background: #fbfcfe;
    }
    tbody tr:hover td { background: #fbfcfd; }
    tbody tr:last-child td { border-bottom: 0; }
    .usage { display: grid; gap: 5px; min-width: 220px; }
    .usage-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      white-space: nowrap;
    }
    .usage-percent { color: var(--muted); font-size: 12px; }
    .bar {
      height: 6px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar span { display: block; height: 100%; background: var(--primary); }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef3f8;
      color: var(--primary-dark);
      white-space: nowrap;
    }
    .badge.off { background: #f7eaea; color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 32px 8px; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    dialog {
      width: min(460px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      color: var(--text);
      box-shadow: 0 18px 55px rgba(28, 39, 54, .2);
    }
    dialog::backdrop { background: rgba(17, 24, 39, .35); }
    .dialog-body { padding: 18px; display: grid; gap: 14px; }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    .dialog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 920px) {
      header, .section-head { align-items: flex-start; flex-direction: column; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .split { grid-template-columns: 1fr; }
      .dialog-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      main { padding: 14px; }
      section { padding: 14px; }
      .metrics { grid-template-columns: 1fr; }
      .toolbar, .toolbar label, .toolbar input { width: 100%; }
    }
  </style>
</head>
<body>
  <header id="appHeader" class="hidden">
    <div class="brand">
      <h1>s-ui 用户流量面板</h1>
      <div class="brand-subtitle">流量、到期时间与下次刷新</div>
    </div>
    <div class="toolbar header-tools">
      <span id="currentUser" class="badge"></span>
      <button class="secondary" id="refresh">刷新</button>
      <button class="ghost" id="logout">退出</button>
    </div>
  </header>

  <div id="loginView" class="login-shell">
    <form id="loginForm" class="login-card">
      <div class="brand">
        <h1>s-ui 用户流量面板</h1>
        <div class="brand-subtitle">使用管理员或用户账号登录</div>
      </div>
      <label>用户名
        <input id="loginUsername" autocomplete="username" required>
      </label>
      <label>密码
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">登录</button>
      <div id="loginStatus" class="status"></div>
    </form>
  </div>

  <main id="appView" class="hidden">
    <section>
      <div class="section-head">
        <div class="section-title">
          <h2>用户流量</h2>
          <div id="status" class="status"></div>
        </div>
        <div class="toolbar">
          <label>搜索
            <input id="search" placeholder="用户名或组">
          </label>
          <button class="secondary admin-only" id="ruleFiltered">筛选定时重置</button>
          <button class="secondary admin-only" id="runDue">执行到期规则</button>
          <button class="danger admin-only" id="resetAll">重置全部</button>
        </div>
      </div>
      <div id="metricsPanel" class="metrics admin-only">
        <div class="metric"><span>用户</span><strong id="metricClients">-</strong></div>
        <div class="metric"><span id="metricRulesLabel">自动规则</span><strong id="metricRules">-</strong></div>
        <div class="metric"><span>停用用户</span><strong id="metricDisabled">-</strong></div>
        <div class="metric"><span>总已用</span><strong id="metricUsed">-</strong></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名称</th>
              <th>组</th>
              <th>状态</th>
              <th>流量</th>
              <th>到期</th>
              <th>下次刷新</th>
              <th class="admin-only">操作</th>
            </tr>
          </thead>
          <tbody id="clientsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="rulesSection" class="admin-only">
      <div class="section-head">
        <div class="section-title">
          <h2>自动规则</h2>
          <div class="status">到达下次重置时间后，后台服务会自动执行。</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>目标</th>
              <th>周期</th>
              <th>下次重置</th>
              <th class="admin-only">操作</th>
            </tr>
          </thead>
          <tbody id="rulesBody"></tbody>
        </table>
      </div>
    </section>

    <section id="accountsSection" class="admin-only">
      <div class="section-head">
        <div class="section-title">
          <h2>登录账号</h2>
          <div class="status">这里只创建普通用户账号；管理员账号由 .env 管理。绑定多个客户端时用英文逗号分隔。</div>
        </div>
      </div>
      <div class="split">
        <div>
          <div class="form-grid">
            <label>用户名
              <input id="accountUsername" placeholder="例如 user1">
            </label>
            <label>密码
              <input id="accountPassword" type="password" placeholder="新增必填，编辑可留空">
            </label>
            <label>绑定客户端
              <input id="accountClients" placeholder="1, wang">
            </label>
            <button id="saveAccount">保存账号</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>用户名</th><th>角色</th><th>绑定客户端</th><th>操作</th></tr>
            </thead>
            <tbody id="accountsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <dialog id="ruleDialog">
    <div class="dialog-body">
      <h2>定时重置</h2>
      <div class="status">当前目标：<strong id="ruleTargetLabel"></strong></div>
      <div class="dialog-grid">
        <label>周期
          <select id="ruleCycle">
            <option value="monthly">每月</option>
            <option value="days">每 N 天</option>
          </select>
        </label>
        <label>每月几号
          <input id="ruleDayOfMonth" type="number" min="1" max="31" value="1">
        </label>
        <label>间隔天数
          <input id="ruleIntervalDays" type="number" min="1" value="30">
        </label>
        <label>时间
          <input id="ruleTime" value="00:00" placeholder="HH:MM">
        </label>
        <label>时区
          <input id="ruleTimezone" value="Asia/Shanghai">
        </label>
      </div>
      <label style="display:flex;align-items:center;gap:8px">
        <input id="ruleEnableAfterReset" type="checkbox" checked>
        重置后重新启用
      </label>
      <div class="dialog-actions">
        <button class="secondary" id="ruleCancel">取消</button>
        <button id="ruleSave">保存定时重置</button>
      </div>
    </div>
  </dialog>

  <dialog id="expiryDialog">
    <div class="dialog-body">
      <h2>设置到期时间</h2>
      <div class="status">当前用户：<strong id="expiryClientName"></strong></div>
      <label>到期时间
        <input id="expiryInput" type="datetime-local">
      </label>
      <label style="display:flex;align-items:center;gap:8px">
        <input id="expiryEnable" type="checkbox" checked>
        如果未过期，保存后启用用户
      </label>
      <div class="dialog-actions">
        <button class="secondary" id="expiryCancel">取消</button>
        <button class="secondary" id="expiryUnlimited">设为无限</button>
        <button id="expirySave">保存</button>
      </div>
    </div>
  </dialog>

  <script>
    const state = { user: null, csrfToken: '', clients: [], rules: [], accounts: [], expiryClient: null, ruleTargets: [] };
    const els = {
      appHeader: document.querySelector('#appHeader'),
      loginView: document.querySelector('#loginView'),
      appView: document.querySelector('#appView'),
      loginForm: document.querySelector('#loginForm'),
      loginUsername: document.querySelector('#loginUsername'),
      loginPassword: document.querySelector('#loginPassword'),
      loginStatus: document.querySelector('#loginStatus'),
      currentUser: document.querySelector('#currentUser'),
      status: document.querySelector('#status'),
      clientsBody: document.querySelector('#clientsBody'),
      rulesBody: document.querySelector('#rulesBody'),
      accountsBody: document.querySelector('#accountsBody'),
      search: document.querySelector('#search'),
      metricClients: document.querySelector('#metricClients'),
      metricRulesLabel: document.querySelector('#metricRulesLabel'),
      metricRules: document.querySelector('#metricRules'),
      metricDisabled: document.querySelector('#metricDisabled'),
      metricUsed: document.querySelector('#metricUsed'),
      accountUsername: document.querySelector('#accountUsername'),
      accountPassword: document.querySelector('#accountPassword'),
      accountClients: document.querySelector('#accountClients'),
      ruleDialog: document.querySelector('#ruleDialog'),
      ruleTargetLabel: document.querySelector('#ruleTargetLabel'),
      ruleCycle: document.querySelector('#ruleCycle'),
      ruleDayOfMonth: document.querySelector('#ruleDayOfMonth'),
      ruleIntervalDays: document.querySelector('#ruleIntervalDays'),
      ruleTime: document.querySelector('#ruleTime'),
      ruleTimezone: document.querySelector('#ruleTimezone'),
      ruleEnableAfterReset: document.querySelector('#ruleEnableAfterReset'),
      expiryDialog: document.querySelector('#expiryDialog'),
      expiryClientName: document.querySelector('#expiryClientName'),
      expiryInput: document.querySelector('#expiryInput'),
      expiryEnable: document.querySelector('#expiryEnable'),
    };

    function isAdmin() {
      return state.user && state.user.role === 'admin';
    }

    function showApp(user, csrfToken = '') {
      state.user = user;
      state.csrfToken = csrfToken;
      els.loginView.classList.add('hidden');
      els.appHeader.classList.remove('hidden');
      els.appView.classList.remove('hidden');
      els.currentUser.textContent = `${user.username} · ${user.role === 'admin' ? '管理员' : '用户'}`;
      document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin()));
    }

    function showLogin() {
      state.user = null;
      state.csrfToken = '';
      els.loginView.classList.remove('hidden');
      els.appHeader.classList.add('hidden');
      els.appView.classList.add('hidden');
      els.loginPassword.value = '';
    }

    function setStatus(text, type = '') {
      els.status.textContent = text;
      els.status.className = 'status ' + type;
    }

    function setLoginStatus(text, type = '') {
      els.loginStatus.textContent = text;
      els.loginStatus.className = 'status ' + type;
    }

    async function api(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const method = (options.method || 'GET').toUpperCase();
      if (method !== 'GET' && path !== '/api/login' && state.csrfToken) {
        headers['X-CSRF-Token'] = state.csrfToken;
      }
      const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, options, { headers }));
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || '请求失败');
      return data;
    }

    function expiryText(ts) {
      if (!ts) return '无限';
      return new Date(ts * 1000).toLocaleString();
    }

    function percent(client) {
      if (!client.volume) return 0;
      return Math.min(100, Math.round(client.used * 100 / client.volume));
    }

    function sizeFormat(value) {
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
      let size = Number(value || 0);
      for (const unit of units) {
        if (Math.abs(size) < 1024 || unit === units[units.length - 1]) return `${size.toFixed(2)} ${unit}`;
        size /= 1024;
      }
      return `${size.toFixed(2)} TiB`;
    }

    function filteredClients() {
      const q = els.search.value.trim().toLowerCase();
      return state.clients.filter(c => !q || c.name.toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q));
    }

    function nextResetSummary() {
      const timestamps = state.clients
        .map(client => Number(client.nextReset || 0))
        .filter(Boolean)
        .sort((a, b) => a - b);
      if (!timestamps.length) return '未设置';
      return new Date(timestamps[0] * 1000).toLocaleString();
    }

    function updateMetrics() {
      const used = state.clients.reduce((sum, client) => sum + Number(client.used || 0), 0);
      els.metricClients.textContent = state.clients.length;
      els.metricRulesLabel.textContent = isAdmin() ? '自动规则' : '下次刷新';
      els.metricRules.textContent = isAdmin() ? state.rules.length : nextResetSummary();
      els.metricDisabled.textContent = state.clients.filter(client => !client.enable).length;
      els.metricUsed.textContent = sizeFormat(used);
    }

    function renderClients() {
      const rows = filteredClients();
      const colspan = isAdmin() ? 7 : 6;
      if (!rows.length) {
        els.clientsBody.innerHTML = `<tr><td class="empty" colspan="${colspan}">没有匹配的用户</td></tr>`;
        return;
      }
      els.clientsBody.innerHTML = rows.map(c => `
        <tr>
          <td>${escapeHtml(c.name)}</td>
          <td>${escapeHtml(c.group || '-')}</td>
          <td><span class="badge ${c.enable ? '' : 'off'}">${c.enable ? '启用' : '停用'}</span></td>
          <td>
            <div class="usage">
              <div class="usage-line">
                <span>${escapeHtml(c.usedText)} / ${escapeHtml(c.volumeText)}</span>
                <span class="usage-percent">${c.volume ? percent(c) + '%' : '无限'}</span>
              </div>
              <div class="bar"><span style="width:${percent(c)}%"></span></div>
            </div>
          </td>
          <td>${expiryText(c.expiry)}</td>
          <td>${c.nextResetText ? escapeHtml(c.nextResetText) : '未设置'}</td>
          ${isAdmin() ? `
            <td>
              <div class="actions">
                <button class="ghost" data-reset="${escapeAttr(c.name)}">重置</button>
                <button data-rule="${escapeAttr(c.name)}">定时重置</button>
                <button class="secondary" data-expiry="${escapeAttr(c.name)}">到期</button>
              </div>
            </td>
          ` : ''}
        </tr>
      `).join('');
      if (!isAdmin()) return;
      els.clientsBody.querySelectorAll('[data-reset]').forEach(btn => {
        btn.addEventListener('click', () => resetTarget('client', btn.dataset.reset));
      });
      els.clientsBody.querySelectorAll('[data-rule]').forEach(btn => {
        btn.addEventListener('click', () => openRuleDialogForClient(btn.dataset.rule));
      });
      els.clientsBody.querySelectorAll('[data-expiry]').forEach(btn => {
        btn.addEventListener('click', () => openExpiryDialog(btn.dataset.expiry));
      });
    }

    function renderRules() {
      const colspan = isAdmin() ? 4 : 3;
      if (!state.rules.length) {
        els.rulesBody.innerHTML = `<tr><td class="empty" colspan="${colspan}">暂无自动规则</td></tr>`;
        return;
      }
      els.rulesBody.innerHTML = state.rules.map(r => {
        const cycle = r.cycle === 'monthly' ? `每月 ${r.dayOfMonth} 号 ${r.time}` : `每 ${r.intervalDays} 天 ${r.time}`;
        const target = r.targetType === 'all' ? '全部用户' : `${r.targetType === 'client' ? '用户' : '组'}：${escapeHtml(r.targetValue)}`;
        return `
          <tr>
            <td>${target}</td>
            <td>${cycle}<br><span class="muted">${escapeHtml(r.timezone)}</span></td>
            <td>${escapeHtml(r.nextResetText)}</td>
            ${isAdmin() ? `<td><button class="danger" data-delete="${r.id}">删除</button></td>` : ''}
          </tr>
        `;
      }).join('');
      if (!isAdmin()) return;
      els.rulesBody.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => deleteRule(btn.dataset.delete));
      });
    }

    function renderAccounts() {
      if (!isAdmin()) return;
      if (!state.accounts.length) {
        els.accountsBody.innerHTML = '<tr><td class="empty" colspan="4">暂无账号</td></tr>';
        return;
      }
      els.accountsBody.innerHTML = state.accounts.map(account => `
        <tr>
          <td>${escapeHtml(account.username)}</td>
          <td>${account.role === 'admin' ? '管理员' : '普通用户'}</td>
          <td>${escapeHtml((account.clientNames || []).join(', ') || '-')}</td>
          <td>
            <div class="actions">
              ${account.role === 'admin'
                ? '<span class="muted">由 .env 管理</span>'
                : `
                  <button class="secondary" data-edit-account="${escapeAttr(account.username)}">编辑</button>
                  <button class="danger" data-delete-account="${escapeAttr(account.username)}">删除</button>
                `}
            </div>
          </td>
        </tr>
      `).join('');
      els.accountsBody.querySelectorAll('[data-edit-account]').forEach(btn => {
        btn.addEventListener('click', () => editAccount(btn.dataset.editAccount));
      });
      els.accountsBody.querySelectorAll('[data-delete-account]').forEach(btn => {
        btn.addEventListener('click', () => deleteAccount(btn.dataset.deleteAccount));
      });
    }

    async function loadAll() {
      setStatus('正在加载...');
      const [clients, rules, accounts] = await Promise.all([
        api('/api/clients'),
        isAdmin() ? api('/api/rules') : Promise.resolve({ rules: [] }),
        isAdmin() ? api('/api/accounts') : Promise.resolve({ accounts: [] }),
      ]);
      state.clients = clients.clients;
      state.rules = rules.rules;
      state.accounts = accounts.accounts;
      updateMetrics();
      renderClients();
      if (isAdmin()) renderRules();
      renderAccounts();
      setStatus(
        isAdmin()
          ? `已加载 ${state.clients.length} 个用户、${state.rules.length} 条规则`
          : `已加载 ${state.clients.length} 个用户`,
        'ok'
      );
    }

    async function login(event) {
      event.preventDefault();
      setLoginStatus('正在登录...');
      const data = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username: els.loginUsername.value.trim(), password: els.loginPassword.value })
      });
      showApp(data.user, data.csrfToken || '');
      setLoginStatus('');
      await loadAll();
    }

    async function bootstrap() {
      try {
        const data = await api('/api/me');
        showApp(data.user, data.csrfToken || '');
        await loadAll();
      } catch {
        showLogin();
      }
    }

    async function logout() {
      await api('/api/logout', { method: 'POST', body: '{}' }).catch(() => {});
      showLogin();
    }

    async function resetTarget(targetType, targetValue = '') {
      const label = targetType === 'all' ? '全部用户' : targetValue;
      if (!confirm(`确定重置 ${label} 的流量？`)) return;
      const data = await api('/api/reset', {
        method: 'POST',
        body: JSON.stringify({ targetType, targetValue, enableAfterReset: true })
      });
      setStatus(data.output || `已重置 ${data.count} 个用户`, 'ok');
      await loadAll();
    }

    function currentRulePayload(targetValue) {
      return {
        targetType: 'client',
        targetValue,
        cycle: els.ruleCycle.value,
        dayOfMonth: Number(els.ruleDayOfMonth.value),
        intervalDays: Number(els.ruleIntervalDays.value),
        time: els.ruleTime.value.trim(),
        timezone: els.ruleTimezone.value.trim(),
        enableAfterReset: els.ruleEnableAfterReset.checked,
      };
    }

    function openRuleDialogForClient(name) {
      state.ruleTargets = [name];
      els.ruleTargetLabel.textContent = `用户：${name}`;
      updateRuleFieldState();
      els.ruleDialog.showModal();
    }

    function openRuleDialogForFiltered() {
      const rows = filteredClients();
      if (!rows.length) return setStatus('当前筛选没有匹配用户', 'err');
      state.ruleTargets = rows.map(c => c.name);
      els.ruleTargetLabel.textContent = `筛选用户：${rows.length} 个`;
      updateRuleFieldState();
      els.ruleDialog.showModal();
    }

    function updateRuleFieldState() {
      const isMonthly = els.ruleCycle.value === 'monthly';
      els.ruleDayOfMonth.disabled = !isMonthly;
      els.ruleIntervalDays.disabled = isMonthly;
    }

    async function saveRuleFromDialog() {
      if (!state.ruleTargets.length) return setStatus('没有选择定时重置目标', 'err');
      let lastNextReset = '';
      for (const name of state.ruleTargets) {
        const data = await api('/api/rules', { method: 'POST', body: JSON.stringify(currentRulePayload(name)) });
        lastNextReset = data.nextResetText;
      }
      const count = state.ruleTargets.length;
      els.ruleDialog.close();
      state.ruleTargets = [];
      setStatus(`已给 ${count} 个用户保存定时重置，下次重置：${lastNextReset}`, 'ok');
      await loadAll();
    }

    function datetimeLocalValue(ts) {
      if (!ts) return '';
      const date = new Date(ts * 1000);
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function openExpiryDialog(name) {
      const client = state.clients.find(c => c.name === name);
      if (!client) return;
      state.expiryClient = client;
      els.expiryClientName.textContent = client.name;
      els.expiryInput.value = datetimeLocalValue(client.expiry);
      els.expiryEnable.checked = true;
      els.expiryDialog.showModal();
    }

    async function saveExpiry(expiry) {
      if (!state.expiryClient) return;
      const data = await api('/api/expiry', {
        method: 'POST',
        body: JSON.stringify({
          targetType: 'client',
          targetValue: state.expiryClient.name,
          expiry,
          enableAfterUpdate: els.expiryEnable.checked,
        })
      });
      els.expiryDialog.close();
      setStatus(data.output || `已更新 ${state.expiryClient.name} 的到期时间`, 'ok');
      state.expiryClient = null;
      await loadAll();
    }

    async function saveExpiryFromInput() {
      if (!els.expiryInput.value) return setStatus('请选择到期时间，或点击“设为无限”', 'err');
      const ts = Math.floor(new Date(els.expiryInput.value).getTime() / 1000);
      if (!Number.isFinite(ts) || ts < 0) return setStatus('到期时间无效', 'err');
      await saveExpiry(ts);
    }

    async function deleteRule(id) {
      if (!confirm('确定删除这条规则？')) return;
      await api(`/api/rules/${id}`, { method: 'DELETE' });
      setStatus('规则已删除', 'ok');
      await loadAll();
    }

    async function runDue() {
      const data = await api('/api/run-due', { method: 'POST', body: '{}' });
      setStatus(data.output || '没有到期规则', 'ok');
      await loadAll();
    }

    function parseClientNames(value) {
      return value.split(',').map(part => part.trim()).filter(Boolean);
    }

    async function saveAccount() {
      const username = els.accountUsername.value.trim();
      if (!username) return setStatus('请输入账号用户名', 'err');
      await api('/api/accounts', {
        method: 'POST',
        body: JSON.stringify({
          username,
          password: els.accountPassword.value,
          role: 'user',
          clientNames: parseClientNames(els.accountClients.value),
        })
      });
      els.accountUsername.value = '';
      els.accountPassword.value = '';
      els.accountClients.value = '';
      setStatus('账号已保存', 'ok');
      await loadAll();
    }

    function editAccount(username) {
      const account = state.accounts.find(item => item.username === username);
      if (!account) return;
      if (account.role === 'admin') return setStatus('管理员账号由 .env 管理，不能在页面编辑', 'err');
      els.accountUsername.value = account.username;
      els.accountPassword.value = '';
      els.accountClients.value = (account.clientNames || []).join(', ');
      setStatus('正在编辑账号，密码留空则不修改', 'ok');
    }

    async function deleteAccount(username) {
      if (!confirm(`确定删除账号 ${username}？`)) return;
      await api(`/api/accounts/${encodeURIComponent(username)}`, { method: 'DELETE' });
      setStatus('账号已删除', 'ok');
      await loadAll();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    els.loginForm.addEventListener('submit', event => login(event).catch(err => setLoginStatus(err.message, 'err')));
    document.querySelector('#logout').addEventListener('click', () => logout());
    document.querySelector('#refresh').addEventListener('click', () => loadAll().catch(err => setStatus(err.message, 'err')));
    document.querySelector('#resetAll').addEventListener('click', () => resetTarget('all').catch(err => setStatus(err.message, 'err')));
    document.querySelector('#ruleFiltered').addEventListener('click', () => openRuleDialogForFiltered());
    document.querySelector('#runDue').addEventListener('click', () => runDue().catch(err => setStatus(err.message, 'err')));
    document.querySelector('#saveAccount').addEventListener('click', () => saveAccount().catch(err => setStatus(err.message, 'err')));
    document.querySelector('#ruleCancel').addEventListener('click', () => els.ruleDialog.close());
    document.querySelector('#ruleSave').addEventListener('click', () => saveRuleFromDialog().catch(err => setStatus(err.message, 'err')));
    els.ruleCycle.addEventListener('change', updateRuleFieldState);
    document.querySelector('#expiryCancel').addEventListener('click', () => els.expiryDialog.close());
    document.querySelector('#expiryUnlimited').addEventListener('click', () => saveExpiry(0).catch(err => setStatus(err.message, 'err')));
    document.querySelector('#expirySave').addEventListener('click', () => saveExpiryFromInput().catch(err => setStatus(err.message, 'err')));
    els.search.addEventListener('input', renderClients);

    updateRuleFieldState();
    bootstrap();
  </script>
</body>
</html>
